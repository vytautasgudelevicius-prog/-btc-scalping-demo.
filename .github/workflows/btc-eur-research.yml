name: BTC EUR historical research
on:
  push:
    paths:
      - 'research/fetch_proxy_history.py'
      - 'research/backtest_candles.py'
      - 'research/evaluate_next_candle.py'
      - 'research/train_direction.py'
      - 'research/train_multimarket.py'
      - 'research/evaluate_cost_edge.py'
      - 'test_cost_edge.py'
      - 'research/risk_curriculum.py'
      - 'test_risk_curriculum.py'
      - 'research/market_regime.py'
      - 'test_market_regime.py'
      - 'research/compare_strategies.py'
      - 'test_compare_strategies.py'
      - 'research/strategy_arena.py'
      - 'research/extra_strategies.py'
      - 'test_strategy_arena.py'
      - 'research/auto_optimize.py'
      - 'research/fee_sensitivity.py'
      - 'research/leverage_simulator.py'
      - 'test_leverage_simulator.py'
      - 'research/technical_analysis_engine.py'
      - 'test_technical_analysis_engine.py'
      - 'research/compare_market_forecasts.py'
      - 'research/cross_market_context.py'
      - 'research/walk_forward_forecast.py'
      - 'research/paper_promotion_gate.py'
      - 'test_research_safety.py'
      - 'test_paper_integration.py'
      - 'bot.py'
      - 'test_cross_market_context.py'
      - 'research/autonomous_decision_cycle.py'
      - 'test_autonomous_decision_cycle.py'
      - 'research/kraken_shadow_observer.py'
      - 'test_kraken_shadow_observer.py'
      - 'research/kraken_shadow_forward.py'
      - 'test_kraken_shadow_forward.py'
      - 'research/best_scalping_hours.py'
      - 'test_best_scalping_hours.py'
      - 'research/strong_signal_walk_forward.py'
      - 'test_strong_signal_walk_forward.py'
      - 'research/strong_signal_backtest.py'
      - 'test_strong_signal_backtest.py'
      - 'research/forecast_expected_value.py'
      - 'test_forecast_expected_value.py'
      - 'test_auto_optimize.py'
      - 'research/fetch_multimarket_history.py'
      - 'research/candles.py'
      - 'test_candles.py'
      - 'test_candle_backtest.py'
      - 'test_train_direction.py'
      - 'research/trading_curriculum.py'
      - 'test_trading_curriculum.py'
      - '.github/workflows/btc-eur-research.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candle tests
        run: python -m unittest test_candles test_candle_backtest test_train_direction test_trading_curriculum test_cost_edge test_risk_curriculum test_market_regime test_compare_strategies test_strategy_arena test_auto_optimize test_leverage_simulator test_technical_analysis_engine test_forecast_expected_value test_cross_market_context test_research_safety test_paper_integration test_strong_signal_backtest test_strong_signal_walk_forward test_best_scalping_hours test_autonomous_decision_cycle test_kraken_shadow_observer test_kraken_shadow_forward -v
      - name: Download BTC EUR 1m public historical proxy
        run: python research/fetch_proxy_history.py
      - name: Download ETH and SOL historical proxy data
        run: python research/fetch_multimarket_history.py
      - name: Run baseline EMA strategy
        run: python backtest.py research/history_btceur_proxy.csv > baseline.json
      - name: Run candle strategy
        run: python research/backtest_candles.py research/history_btceur_proxy.csv > candles.json
      - name: Evaluate next 5m candle direction on holdout
        run: python research/evaluate_next_candle.py research/history_btceur_proxy.csv > next_candle.json
      - name: Train directional model and evaluate untouched test segment
        run: python research/train_direction.py research/history_btceur_proxy.csv > direction_model.json
      - name: Compare BTC-only vs multi-market training on BTC holdout
        run: python research/train_multimarket.py research/history_btceur_proxy.csv ETH research/history_etheur_proxy.csv SOL research/history_soleur_proxy.csv > transfer_comparison.json
      - name: Evaluate BTC 5m directional predictions after costs
        run: python research/evaluate_cost_edge.py research/history_btceur_proxy.csv > cost_edge.json
      - name: Compare three trading strategies after fees
        run: python research/compare_strategies.py research/history_btceur_proxy.csv > strategy_comparison.json
      - name: Run twelve-strategy learning arena and diagnose failures
        run: python research/strategy_arena.py research/history_btceur_proxy.csv > strategy_arena.json
      - name: Tune parameters on validation and retest untouched BTC holdout
        run: python research/auto_optimize.py research/history_btceur_proxy.csv > auto_optimize.json
      - name: Compare hypothetical trading fee scenarios
        run: python research/fee_sensitivity.py research/history_btceur_proxy.csv > fee_sensitivity.json
      - name: Forecast next BTC 5m return and evaluate expected net edge
        run: python research/forecast_expected_value.py research/history_btceur_proxy.csv > forecast_expected_value.json
      - name: Backtest confirmed BTC strong signals after costs
        run: python research/strong_signal_backtest.py research/history_btceur_proxy.csv > strong_signal_backtest.json
      - name: Walk-forward test strong BTC signals after costs
        run: python research/strong_signal_walk_forward.py research/history_btceur_proxy.csv > strong_signal_walk_forward.json
      - name: Find best BTC scalping UTC hours on validation and verify untouched test
        run: python research/best_scalping_hours.py research/history_btceur_proxy.csv > best_scalping_hours.json
      - name: Verify autonomous BTC decision cycle after costs
        run: python research/autonomous_decision_cycle.py research/history_btceur_proxy.csv > autonomous_decision_cycle.json
      - name: Compare BTC ETH SOL forecast profitability after costs
        run: python research/compare_market_forecasts.py BTC/EUR research/history_btceur_proxy.csv ETH/EUR research/history_etheur_proxy.csv SOL/EUR research/history_soleur_proxy.csv > market_forecasts.json
      - name: Verify walk-forward BTC ETH SOL price forecasts
        run: |
          python research/walk_forward_forecast.py research/history_btceur_proxy.csv > btc_walk_forward.json
          python research/walk_forward_forecast.py research/history_etheur_proxy.csv > eth_walk_forward.json
          python research/walk_forward_forecast.py research/history_soleur_proxy.csv > sol_walk_forward.json
      - name: Print result summaries
        run: |
          python - <<'PY'
          import json
          for name in ('baseline', 'candles', 'next_candle', 'direction_model', 'transfer_comparison', 'cost_edge', 'strategy_comparison', 'strategy_arena', 'auto_optimize', 'fee_sensitivity', 'forecast_expected_value', 'strong_signal_backtest', 'strong_signal_walk_forward', 'best_scalping_hours', 'autonomous_decision_cycle', 'market_forecasts', 'btc_walk_forward', 'eth_walk_forward', 'sol_walk_forward'):
              data=json.load(open(name+'.json'))
              print(name, json.dumps(data, indent=2)[:14000])
          PY
      - name: Publish research verdict to GitHub run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["# BTC/EUR research verdict", "",
                   "Research only. No real trades, no DEMO strategy deployment.", ""]
          def load(name):
              path = Path(name + ".json")
              return json.loads(path.read_text()) if path.exists() else None
          transfer = load("transfer_comparison")
          if transfer:
              btc = transfer["btc_only"]["test"]
              multi = transfer["multi_market"]["test"]
              lines += ["## Unseen BTC directional test",
                        f"- BTC-only accuracy: {btc['accuracy_pct']}% ({btc['signals']} signals)",
                        f"- BTC + ETH + SOL accuracy: {multi['accuracy_pct']}% ({multi['signals']} signals)", ""]
          else:
              lines += ["- Multi-market comparison unavailable (check failed step).", ""]
          edge = load("cost_edge")
          if edge and edge.get("test"):
              test = edge["test"]
              avg = test.get("avg_net_return_pct")
              trades = test.get("trades", 0)
              lines += ["## Five-minute strategy after costs",
                        f"- Untouched BTC test trades: {trades}",
                        f"- Average net return per unit-notional trade: {avg}%",
                        f"- Round-trip cost: {test.get('cost_roundtrip_pct')}%", ""]
              if trades < 30 or avg is None or avg <= 0:
                  verdict = "DO NOT DEPLOY: no demonstrated positive net edge"
              else:
                  verdict = "RESEARCH ONLY: positive sample, but not yet robust enough to deploy"
              lines += [f"**Verdict: {verdict}**", ""]
          else:
              lines += ["**Verdict: DO NOT DEPLOY; cost-aware test missing.**", ""]
          strong = load("strong_signal_backtest")
          if strong:
              lines += ["## Strong-signal BTC holdout (costs included)",
                        f"- Verdict: {strong.get('decision')}",
                        f"- Validation: {strong.get('validation')}",
                        f"- Unseen test: {strong.get('untouched_test')}",
                        f"- Same-threshold forecast baseline: {strong.get('baseline_same_threshold_test')}", ""]
          else:
              lines += ["- Strong-signal backtest missing — no deployment approval", ""]
          swf = load("strong_signal_walk_forward")
          if swf:
              lines += ["## Strong-signal walk-forward verification",
                        f"- Verdict: {swf.get('decision')}; modeled round-trip costs: {swf.get('cost_roundtrip_pct')}%"]
              for fold in swf.get("folds", []):
                  lines += [f"- Fold {fold['fold']}: {fold.get('decision')}; validation {fold.get('validation')}; unseen test {fold.get('test')}"]
              lines += [""]
          else:
              lines += ["- Strong-signal walk-forward unavailable — do not deploy", ""]
          hours = load("best_scalping_hours")
          if hours:
              lines += ["## Best BTC scalping UTC hours (holdout after costs)",
                        f"- Verdict: {hours.get('decision')}",
                        f"- Selected UTC hours: {hours.get('selected_utc_hours')}",
                        f"- Validation: {hours.get('validation')}",
                        f"- Untouched test: {hours.get('untouched_test')}", ""]
          else:
              lines += ["- BTC hourly analysis missing — do not deploy", ""]
          cycle = load("autonomous_decision_cycle")
          if cycle:
              lines += ["## Autonomous BTC decision cycle",
                        f"- Verdict: {cycle.get('decision')}",
                        f"- Historical edge verified: {cycle.get('signal_confirmation',{}).get('walk_forward_candidate')}",
                        f"- DEMO orders enabled: {cycle.get('demo_trade',{}).get('orders_enabled')}",
                        f"- Reason: {cycle.get('demo_trade',{}).get('reason')}", ""]
          else:
              lines += ["- Autonomous decision cycle report missing — do not deploy", ""]
          lines += ["## Walk-forward forecast after modeled trading costs", ""]
          for symbol, name in (("BTC/EUR","btc_walk_forward"),("ETH/EUR","eth_walk_forward"),("SOL/EUR","sol_walk_forward")):
              report = load(name)
              if not report:
                  lines += [f"- {symbol}: MISSING REPORT — do not deploy"]
                  continue
              lines += [f"- {symbol}: **{report.get('decision','NO_TRADE')}**; assumed round-trip cost {report.get('cost_roundtrip_pct')}%"]
              for fold in report.get("folds",[]):
                  holdout = fold.get("test",{})
                  lines += [f"  - Fold {fold['fold']}: {fold.get('decision','NO_TRADE')}; {holdout.get('trades',0)} test trades; average net {holdout.get('avg_net_pct')}%"]
          lines += ["", "**Railway deployment: NOT AUTHORIZED by this workflow.**",
                    "Direction accuracy alone is not trading profitability. Historical Binance proxy data are not Kraken execution fills."]
          out.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-eur-research-results
          path: |
            baseline.json
            candles.json
            next_candle.json
            direction_model.json
            transfer_comparison.json
            cost_edge.json
            strategy_comparison.json
            strategy_arena.json
            auto_optimize.json
            fee_sensitivity.json
            forecast_expected_value.json
            strong_signal_backtest.json
            strong_signal_walk_forward.json
            best_scalping_hours.json
            autonomous_decision_cycle.json
            market_forecasts.json
            btc_walk_forward.json
            eth_walk_forward.json
            sol_walk_forward.json
          if-no-files-found: warn
