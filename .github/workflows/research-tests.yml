name: Research backtest checks
on:
  push:
    paths:
      - 'bot.py'
      - 'research/**'
      - 'test_*.py'
      - 'backtest.py'
      - 'test_backtest.py'
      - 'fetch_recent_kraken.py'
      - 'import_kraken_archive.py'
      - '.github/workflows/research-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research dependencies
        run: pip install -r research/requirements.txt
      - name: Syntax check
        run: python -m py_compile bot.py backtest.py test_backtest.py test_research.py fetch_recent_kraken.py import_kraken_archive.py research/study.py research/download_kraken.py
      - name: Unit tests
        run: python -m unittest discover -v
