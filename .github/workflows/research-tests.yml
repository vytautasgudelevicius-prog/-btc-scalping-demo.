name: Research backtest checks
on:
  push:
    paths:
      - 'backtest.py'
      - 'test_backtest.py'
      - 'fetch_recent_kraken.py'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile backtest.py test_backtest.py fetch_recent_kraken.py
      - name: Unit tests
        run: python -m unittest -v test_backtest.py
