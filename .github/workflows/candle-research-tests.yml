name: Candle research tests
on:
  push:
    paths:
      - 'research/**'
      - 'test_candles.py'
      - '.github/workflows/candle-research-tests.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'test_candles.py'
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile paper trader
        run: python -m py_compile research/isolated_paper_experiment.py research/unified_shadow_paper.py
      - name: Test candle research and paper safeguards
        run: python -m unittest test_candles -v && python -m unittest discover -s tests -p 'test_paper_*.py' -v
  replay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch completed Kraken candles and replay paper strategy
        run: |
          python -m research.build_kraken_replay --output /tmp/kraken_snapshots.jsonl
          python -m research.offline_replay /tmp/kraken_snapshots.jsonl
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl
          echo '=== Sensitivity: reduced fee 0.4% per side ==='
          python -m research.offline_replay /tmp/kraken_snapshots.jsonl --fee 0.004
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0.004
          echo '=== Sensitivity: reduced fee 0.2% per side ==='
          python -m research.offline_replay /tmp/kraken_snapshots.jsonl --fee 0.002
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0.002
          echo '=== Diagnostic only: fee 0.1% one-way ==='
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0.001
          echo '=== Diagnostic only: fee 0.05% one-way ==='
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0.0005
          echo '=== Diagnostic only: zero fee theoretical upper bound ==='
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0
          echo '=== Sensitivity: zero fee and zero slippage, theoretical ceiling ==='
          python -m research.diagnose_entry_gate /tmp/kraken_snapshots.jsonl --fee 0 --slip 0

          echo '=== Offline stop/target feasibility grid (not trading returns) ==='
          python -m research.entry_geometry_grid /tmp/kraken_snapshots.jsonl
