name: Candle research tests
on:
  push:
    paths:
      - 'research/**'
      - 'test_candles.py'
      - '.github/workflows/candle-research-tests.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'test_candles.py'
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile paper trader
        run: python -m py_compile research/isolated_paper_experiment.py research/unified_shadow_paper.py
      - name: Test candle research and paper safeguards
        run: python -m unittest test_candles -v && python -m unittest discover -s tests -p 'test_paper_cost_gate.py' -v
