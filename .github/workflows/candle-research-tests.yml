name: Candle research tests
on:
  push:
    paths:
      - 'research/**'
      - 'test_candles.py'
      - '.github/workflows/candle-research-tests.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'test_candles.py'
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test candle research
        run: python -m unittest test_candles -v
